<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A small music player built with the HTML audio element and vanilla JavaScript.">
    <title>Music Player</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="playlist.js" defer></script>
    <script src="index.js" defer></script>
</head>
<body>

<main class="app-wrapper">
    <h1 class="visually-hidden">Music Player</h1>

    <section class="player" aria-label="Player">
        <div class="cover">
            <img class="cover-img" src="assets/covers/paper-lanterns.svg" alt="" width="200" height="200">
        </div>

        <div class="track" aria-live="polite">
            <h2 class="track-title">Paper Lanterns</h2>
            <p class="track-detail">Generated loop · C major · 80 BPM</p>
        </div>

        <div class="progress">
            <input class="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Seek">
            <div class="times" aria-hidden="true">
                <span class="time-current">0:00</span>
                <span class="time-total">0:00</span>
            </div>
        </div>

        <div class="player-controls">
            <button type="button" class="skip-btn" data-action="previous" aria-label="Previous track">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5h2.5v14H5zM20 5v14L9 12z"/></svg>
            </button>
            <button type="button" class="play-btn" data-action="toggle" aria-label="Play">
                <svg class="icon-play" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>
            </button>
            <button type="button" class="skip-btn" data-action="next" aria-label="Next track">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M16.5 5H19v14h-2.5zM4 5v14l11-7z"/></svg>
            </button>
        </div>

        <p class="status" role="status"></p>

        <p class="next-up">Next up: <span>Night Tram</span></p>

        <audio id="audio" preload="metadata"></audio>
    </section>

    <p class="shortcuts">
        <kbd>Space</kbd> play or pause · <kbd>←</kbd> <kbd>→</kbd> seek 5 s · <kbd>P</kbd> <kbd>N</kbd> previous or next
    </p>

    <noscript>
        <p class="shortcuts">The player needs JavaScript to play audio.</p>
    </noscript>
</main>

<footer class="footer">
    <a href="https://github.com/aaronkuy">Aaron Kuyucu</a> · <a href="https://github.com/aaronkuy/music-player">Source on GitHub</a>
</footer>

</body>
</html>
